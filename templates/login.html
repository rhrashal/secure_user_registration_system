{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
    <h2>User Login</h2>

    <form action="{{ url_for('login') }}" method="POST" onsubmit="return validateLoginForm()">
        <input type="email" name="loginEmail" id="loginEmail" placeholder="Enter Email"
            oninput="validateField('loginEmail')"
            value="{{ request.form.get('loginEmail', '') }}">
        <span class="error" id="loginEmailError">{{ errors.get('loginEmail', '') }}</span>

        <input type="password" name="loginPassword" id="loginPassword" placeholder="Enter Password"
            onkeyup="showStrength('loginPassword', 'loginStrengthText'); validateField('loginPassword')">
        <span class="error" id="loginPasswordError">{{ errors.get('loginPassword', '') }}</span>

        <p id="loginStrengthText"></p>

        {% if errors.get('login') %}
        <span class="error" style="text-align:center;margin-bottom:10px">{{ errors['login'] }}</span>
        {% endif %}

        <button type="submit">Login</button>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>
    </form>
</div>
{% endblock %}
