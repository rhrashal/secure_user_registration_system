{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container">
    <h2>User Registration</h2>

    <form action="{{ url_for('register') }}" method="POST" onsubmit="return validateRegisterForm()">
        <input type="text" name="fullName" id="fullName" placeholder="Enter Full Name"
            oninput="validateField('fullName')"
            value="{{ request.form.get('fullName', '') }}">
        <span class="error" id="fullNameError">{{ errors.get('fullName', '') }}</span>

        <input type="email" name="email" id="email" placeholder="Enter Email"
            oninput="validateField('email')"
            value="{{ request.form.get('email', '') }}">
        <span class="error" id="emailError">{{ errors.get('email', '') }}</span>

        <input type="tel" name="phone" id="phone" placeholder="Enter Phone Number"
            oninput="validateField('phone')"
            value="{{ request.form.get('phone', '') }}">
        <span class="error" id="phoneError">{{ errors.get('phone', '') }}</span>

        <input type="password" name="password" id="password" placeholder="Enter Password"
            onkeyup="showStrength(); validateField('password')">
        <span class="error" id="passwordError">{{ errors.get('password', '') }}</span>

        <p id="strengthText"></p>

        <button type="submit">Register</button>

        <p>
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </form>
</div>
{% endblock %}
